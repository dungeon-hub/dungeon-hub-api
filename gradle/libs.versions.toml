[versions]
slf4j2-api = "2.0.17"
okhttp = "4.12.0"
ktor = "3.2.3" # https://github.com/ktorio/ktor
ktor-moshi = "4.0.0"
kord-extensions = "2.4.1-SNAPSHOT"

[libraries]
slf4j2-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j2-api" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-moshi = { module = "com.hypercubetools:ktor-moshi", version.ref = "ktor-moshi" }
kord-extensions = { module = "dev.kordex:kord-extensions", version.ref = "kord-extensions" }
